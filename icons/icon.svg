<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 読書記録 アイコンの元絵: 深い緑の地に、開いた本としおり紐だけ
       PNG は icons/render-icons.ps1 で作る(Edge で描いて縮小) -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1.1">
      <stop offset="0" stop-color="#3f6a5f" />
      <stop offset="1" stop-color="#1f3d37" />
    </radialGradient>
    <linearGradient id="pageL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#d9ccb5" />
      <stop offset="0.18" stop-color="#efe6d6" />
      <stop offset="1" stop-color="#fbf7ef" />
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3c5ac" />
      <stop offset="0.18" stop-color="#ebe1cf" />
      <stop offset="1" stop-color="#f7f1e6" />
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99a52" />
      <stop offset="1" stop-color="#a87a3a" />
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8432f" />
      <stop offset="1" stop-color="#cf6247" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" />

  <g transform="translate(512 560) scale(1.16) translate(-512 -600)">
  <!-- 影 -->
  <path d="M512 470 C 440 430 320 422 196 442 L 196 742 C 320 726 440 734 512 778 C 584 734 704 726 828 742 L 828 442 C 704 422 584 430 512 470 Z" fill="#0f2622" opacity="0.55" filter="url(#shadow)" transform="translate(14 34)" />

  <!-- 表紙 -->
  <path d="M512 436 C 442 396 322 388 192 408 L 192 724 C 322 708 442 716 512 758 C 582 716 702 708 832 724 L 832 408 C 702 388 582 396 512 436 Z" fill="url(#cover)" />
  <!-- ページの厚み -->
  <path d="M512 426 C 444 386 326 378 206 398 L 206 708 C 326 692 444 700 512 742 C 580 700 698 692 818 708 L 818 398 C 698 378 580 386 512 426 Z" fill="#e2d6c0" />
  <g fill="none" stroke="#c4b496" stroke-width="2.5">
    <path d="M206 700 C 326 684 444 692 512 734 C 580 692 698 684 818 700" />
    <path d="M206 692 C 326 676 444 684 512 726 C 580 684 698 676 818 692" />
  </g>
  <!-- 開いたページ -->
  <path d="M512 418 C 470 360 330 350 214 384 L 214 684 C 330 668 446 676 512 718 Z" fill="url(#pageL)" />
  <path d="M512 418 C 554 360 694 350 810 384 L 810 684 C 694 668 578 676 512 718 Z" fill="url(#pageR)" />
  <path d="M512 418 L 512 718" stroke="#bfae8e" stroke-width="3" />

  <!-- しおり紐 -->
  <path d="M500 712 L 500 846 L 516 826 L 532 846 L 532 704 Z" fill="url(#ribbon)" />
  <path d="M500 712 L 532 704 L 532 716 L 500 724 Z" fill="#7d2c1e" opacity="0.35" />

  </g>

  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay" />
</svg>
